<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tabletBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2238"/>
      <stop offset="100%" stop-color="#0c0e1a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1124"/>
      <stop offset="50%" stop-color="#10152e"/>
      <stop offset="100%" stop-color="#161c3b"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef5b52" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#7b4bf7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7b4bf7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chartStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b4bf7"/>
      <stop offset="35%" stop-color="#de358d"/>
      <stop offset="70%" stop-color="#ef5b52"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="coralPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef5b52"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Stage Glow -->
  <rect x="40" y="30" width="720" height="440" rx="36" fill="#7b4bf7" opacity="0.08" filter="url(#softGlow)"/>
  <rect x="120" y="80" width="400" height="260" rx="30" fill="#ef5b52" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Tablet Hardware Frame -->
  <rect x="20" y="16" width="760" height="468" rx="28" fill="url(#tabletBezel)" stroke="#374163" stroke-width="2.5"/>
  <rect x="22" y="18" width="756" height="464" rx="26" fill="none" stroke="#252b48" stroke-width="1.5"/>

  <!-- Front Camera Lens -->
  <circle cx="400" cy="27" r="3.5" fill="#1b2038" stroke="#333b5c" stroke-width="1"/>
  <circle cx="400" cy="27" r="1.5" fill="#4f5985"/>

  <!-- Screen Glass Surface -->
  <rect x="36" y="38" width="728" height="424" rx="16" fill="url(#screenGrad)"/>

  <!-- Top App Navigation Bar -->
  <rect x="36" y="38" width="728" height="48" rx="16" fill="#121733" stroke="#212952" stroke-width="1"/>
  <!-- Status Dot -->
  <circle cx="62" cy="62" r="5" fill="#10b981"/>
  <circle cx="62" cy="62" r="9" fill="#10b981" opacity="0.25"/>
  <text x="80" y="66" fill="#ffffff" font-size="13" font-weight="700" font-family="'Poppins', sans-serif">ADYANTRA GROWTH COMMAND</text>
  <rect x="306" y="52" width="76" height="20" rx="10" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="0.8"/>
  <text x="344" y="66" fill="#10b981" font-size="10" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">LIVE ROAS 4.8x</text>

  <!-- Right App Badges -->
  <rect x="620" y="52" width="124" height="20" rx="6" fill="#1a2245" stroke="#2d3763" stroke-width="1"/>
  <text x="682" y="66" fill="#93a2cc" font-size="10.5" font-family="'Poppins', sans-serif" text-anchor="middle">All Channels Sync • 99.9%</text>

  <!-- Left Sidebar / Channel Metrics List -->
  <g transform="translate(56, 102)">
    <!-- Column Header -->
    <text x="0" y="14" fill="#8c9abf" font-size="11" font-weight="600" font-family="'Poppins', sans-serif" letter-spacing="0.05em">ACTIVE CHANNELS</text>

    <!-- Channel Card 1: Google Ads -->
    <g transform="translate(0, 26)">
      <rect width="216" height="66" rx="12" fill="#141a38" stroke="#252f5c" stroke-width="1"/>
      <circle cx="24" cy="33" r="13" fill="#ef5b52" opacity="0.16"/>
      <text x="24" y="38" fill="#ef5b52" font-size="12" font-weight="800" font-family="sans-serif" text-anchor="middle">G</text>
      <text x="46" y="27" fill="#ffffff" font-size="12" font-weight="600" font-family="'Poppins', sans-serif">Google Search &amp; PMax</text>
      <text x="46" y="44" fill="#8896bd" font-size="10" font-family="'Poppins', sans-serif">Cost/Conv: $18.40</text>
      <text x="46" y="58" fill="#10b981" font-size="10.5" font-weight="700" font-family="'Poppins', sans-serif">ROAS: 5.2x ▲</text>
      <rect x="168" y="16" width="36" height="18" rx="4" fill="#10b981" opacity="0.16"/>
      <text x="186" y="29" fill="#10b981" font-size="9" font-weight="700" font-family="sans-serif" text-anchor="middle">TOP 1</text>
    </g>

    <!-- Channel Card 2: Meta Ads -->
    <g transform="translate(0, 102)">
      <rect width="216" height="66" rx="12" fill="#141a38" stroke="#252f5c" stroke-width="1"/>
      <circle cx="24" cy="33" r="13" fill="#7b4bf7" opacity="0.16"/>
      <text x="24" y="38" fill="#7b4bf7" font-size="12" font-weight="800" font-family="sans-serif" text-anchor="middle">M</text>
      <text x="46" y="27" fill="#ffffff" font-size="12" font-weight="600" font-family="'Poppins', sans-serif">Meta &amp; Instagram Reels</text>
      <text x="46" y="44" fill="#8896bd" font-size="10" font-family="'Poppins', sans-serif">CTR: 4.82% • 1.2M Reach</text>
      <text x="46" y="58" fill="#10b981" font-size="10.5" font-weight="700" font-family="'Poppins', sans-serif">ROAS: 4.6x ▲</text>
      <rect x="168" y="16" width="36" height="18" rx="4" fill="#7b4bf7" opacity="0.16"/>
      <text x="186" y="29" fill="#c084fc" font-size="9" font-weight="700" font-family="sans-serif" text-anchor="middle">VIRAL</text>
    </g>

    <!-- Channel Card 3: AI Automations -->
    <g transform="translate(0, 178)">
      <rect width="216" height="66" rx="12" fill="#141a38" stroke="#252f5c" stroke-width="1"/>
      <circle cx="24" cy="33" r="13" fill="#38bdf8" opacity="0.16"/>
      <text x="24" y="38" fill="#38bdf8" font-size="12" font-weight="800" font-family="sans-serif" text-anchor="middle">AI</text>
      <text x="46" y="27" fill="#ffffff" font-size="12" font-weight="600" font-family="'Poppins', sans-serif">Lead Drips &amp; WhatsApp</text>
      <text x="46" y="44" fill="#8896bd" font-size="10" font-family="'Poppins', sans-serif">Avg Response: 2.4s</text>
      <text x="46" y="58" fill="#10b981" font-size="10.5" font-weight="700" font-family="'Poppins', sans-serif">Qual Rate: 78% ▲</text>
      <rect x="168" y="16" width="36" height="18" rx="4" fill="#38bdf8" opacity="0.16"/>
      <text x="186" y="29" fill="#38bdf8" font-size="9" font-weight="700" font-family="sans-serif" text-anchor="middle">24/7</text>
    </g>

    <!-- Channel Card 4: Programmatic SEO -->
    <g transform="translate(0, 254)">
      <rect width="216" height="66" rx="12" fill="#141a38" stroke="#252f5c" stroke-width="1"/>
      <circle cx="24" cy="33" r="13" fill="#de358d" opacity="0.16"/>
      <text x="24" y="38" fill="#de358d" font-size="12" font-weight="800" font-family="sans-serif" text-anchor="middle">S</text>
      <text x="46" y="27" fill="#ffffff" font-size="12" font-weight="600" font-family="'Poppins', sans-serif">Organic Keyword Moat</text>
      <text x="46" y="44" fill="#8896bd" font-size="10" font-family="'Poppins', sans-serif">Top 3 Positions: 1,420</text>
      <text x="46" y="58" fill="#10b981" font-size="10.5" font-weight="700" font-family="'Poppins', sans-serif">+310% Traffic ▲</text>
      <rect x="168" y="16" width="36" height="18" rx="4" fill="#de358d" opacity="0.16"/>
      <text x="186" y="29" fill="#f472b6" font-size="9" font-weight="700" font-family="sans-serif" text-anchor="middle">MOAT</text>
    </g>
  </g>

  <!-- Right Dashboard Content Area -->
  <g transform="translate(290, 102)">
    <!-- KPI Summary Pills Row -->
    <g>
      <!-- KPI 1 -->
      <rect x="0" y="0" width="144" height="66" rx="12" fill="#141938" stroke="#252f5c" stroke-width="1"/>
      <text x="16" y="24" fill="#8896bd" font-size="10.5" font-weight="500" font-family="'Poppins', sans-serif">Attributed Revenue</text>
      <text x="16" y="50" fill="#ffffff" font-size="20" font-weight="700" font-family="'Poppins', sans-serif">$1,842,500</text>
      <rect x="108" y="14" width="24" height="16" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="120" y="25" fill="#10b981" font-size="9" font-weight="700" font-family="sans-serif" text-anchor="middle">+44%</text>

      <!-- KPI 2 -->
      <rect x="156" y="0" width="144" height="66" rx="12" fill="#141938" stroke="#252f5c" stroke-width="1"/>
      <text x="172" y="24" fill="#8896bd" font-size="10.5" font-weight="500" font-family="'Poppins', sans-serif">Blended ROAS</text>
      <text x="172" y="50" fill="#ef5b52" font-size="20" font-weight="700" font-family="'Poppins', sans-serif">4.82x</text>
      <rect x="264" y="14" width="24" height="16" rx="4" fill="rgba(239,91,82,0.2)"/>
      <text x="276" y="25" fill="#ef5b52" font-size="9" font-weight="700" font-family="sans-serif" text-anchor="middle">HOT</text>

      <!-- KPI 3 -->
      <rect x="312" y="0" width="144" height="66" rx="12" fill="#141938" stroke="#252f5c" stroke-width="1"/>
      <text x="328" y="24" fill="#8896bd" font-size="10.5" font-weight="500" font-family="'Poppins', sans-serif">Qualified Booked Calls</text>
      <text x="328" y="50" fill="#38bdf8" font-size="20" font-weight="700" font-family="'Poppins', sans-serif">2,418</text>
      <rect x="420" y="14" width="24" height="16" rx="4" fill="rgba(56,189,248,0.2)"/>
      <text x="432" y="25" fill="#38bdf8" font-size="9" font-weight="700" font-family="sans-serif" text-anchor="middle">SYNC</text>
    </g>

    <!-- Main Dynamic Chart Stage -->
    <g transform="translate(0, 80)">
      <rect width="456" height="240" rx="14" fill="#141938" stroke="#252f5c" stroke-width="1"/>
      
      <!-- Chart Heading & Controls -->
      <text x="20" y="30" fill="#ffffff" font-size="13" font-weight="600" font-family="'Poppins', sans-serif">Revenue &amp; ROAS Acceleration Trajectory</text>
      <text x="20" y="47" fill="#8896bd" font-size="10" font-family="'Poppins', sans-serif">Aggregated Multi-Platform Attribution (Meta CAPI + Google)</text>
      
      <rect x="364" y="18" width="72" height="22" rx="11" fill="url(#coralPill)"/>
      <text x="400" y="33" fill="#ffffff" font-size="9.5" font-weight="700" font-family="'Poppins', sans-serif" text-anchor="middle">+340% YoY</text>

      <!-- Grid Horizontal Guide Lines -->
      <line x1="20" y1="80" x2="436" y2="80" stroke="#21284d" stroke-dasharray="3 3"/>
      <line x1="20" y1="125" x2="436" y2="125" stroke="#21284d" stroke-dasharray="3 3"/>
      <line x1="20" y1="170" x2="436" y2="170" stroke="#21284d" stroke-dasharray="3 3"/>
      <line x1="20" y1="215" x2="436" y2="215" stroke="#21284d"/>

      <!-- Spline Shaded Area -->
      <path d="M 24 200 C 70 195, 110 175, 150 160 C 190 145, 230 152, 270 115 C 310 85, 360 88, 400 48 L 430 42 L 430 215 L 24 215 Z" fill="url(#chartGlow)"/>

      <!-- Spline Main Curve -->
      <path d="M 24 200 C 70 195, 110 175, 150 160 C 190 145, 230 152, 270 115 C 310 85, 360 88, 400 48 L 430 42" fill="none" stroke="url(#chartStroke)" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Peak Metric Callout Floating Chip -->
      <g transform="translate(330, 36)">
        <rect width="94" height="38" rx="8" fill="#1b214a" stroke="#ef5b52" stroke-width="1.2" filter="url(#softGlow)"/>
        <text x="47" y="16" fill="#fca5a5" font-size="9" font-weight="500" font-family="'Poppins', sans-serif" text-anchor="middle">Oct High Velocity</text>
        <text x="47" y="31" fill="#ffffff" font-size="12" font-weight="700" font-family="'Poppins', sans-serif" text-anchor="middle">$184.2K / wk</text>
      </g>

      <!-- Plot Point Nodes -->
      <circle cx="150" cy="160" r="4.5" fill="#7b4bf7" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="270" cy="115" r="4.5" fill="#de358d" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="400" cy="48" r="5" fill="#ef5b52" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>
</svg>
