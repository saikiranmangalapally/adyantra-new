<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAnalytics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="funnel1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="funnel2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b4bf7"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="funnel3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#de358d"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="funnel4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef5b52"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="funnelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="600" height="400" rx="20" fill="url(#bgAnalytics)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(24, 24)">
    <rect width="188" height="28" rx="14" fill="#fff1f2" stroke="rgba(239,91,82,0.2)"/>
    <circle cx="14" cy="14" r="4" fill="#ef5b52"/>
    <text x="26" y="18" fill="#ef5b52" font-size="11" font-weight="700" font-family="'Poppins', sans-serif" letter-spacing="0.04em">DATA &amp; ATTRIBUTION</text>
    <text x="208" y="19" fill="#64748b" font-size="12" font-family="'Poppins', sans-serif">Full-Funnel Conversion Intelligence</text>
  </g>

  <!-- Left: Funnel Visualization -->
  <g transform="translate(32, 75)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="310" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#funnelShadow)"/>
    <rect x="10" y="10" width="10" height="32" rx="5" fill="url(#funnel1)"/>
    <text x="28" y="24" fill="#0f172a" font-size="11" font-weight="700" font-family="'Poppins', sans-serif">1. Impressions &amp; Traffic</text>
    <text x="28" y="38" fill="#64748b" font-size="9.5" font-family="'Poppins', sans-serif">Google Search, Meta Reels, YouTube</text>
    <text x="295" y="32" fill="#0284c7" font-size="13" font-weight="700" font-family="'Poppins', sans-serif" text-anchor="end">1.42M</text>

    <!-- Stage 2 -->
    <rect x="20" y="62" width="270" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#funnelShadow)"/>
    <rect x="30" y="72" width="10" height="32" rx="5" fill="url(#funnel2)"/>
    <text x="48" y="86" fill="#0f172a" font-size="11" font-weight="700" font-family="'Poppins', sans-serif">2. Intent Clicks &amp; Visits</text>
    <text x="48" y="100" fill="#64748b" font-size="9.5" font-family="'Poppins', sans-serif">CRO Landing Page Engagement</text>
    <text x="275" y="94" fill="#7b4bf7" font-size="13" font-weight="700" font-family="'Poppins', sans-serif" text-anchor="end">84,200</text>

    <!-- Stage 3 -->
    <rect x="40" y="124" width="230" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#funnelShadow)"/>
    <rect x="50" y="134" width="10" height="32" rx="5" fill="url(#funnel3)"/>
    <text x="68" y="148" fill="#0f172a" font-size="11" font-weight="700" font-family="'Poppins', sans-serif">3. Qualified Leads &amp; Calls</text>
    <text x="68" y="162" fill="#64748b" font-size="9.5" font-family="'Poppins', sans-serif">AI Lead Nurture &amp; Bookings</text>
    <text x="255" y="156" fill="#de358d" font-size="13" font-weight="700" font-family="'Poppins', sans-serif" text-anchor="end">3,640</text>

    <!-- Stage 4 -->
    <rect x="60" y="186" width="190" height="52" rx="10" fill="#ffffff" stroke="#ef5b52" stroke-width="1.5" filter="url(#funnelShadow)"/>
    <rect x="70" y="196" width="10" height="32" rx="5" fill="url(#funnel4)"/>
    <text x="88" y="210" fill="#0f172a" font-size="11" font-weight="700" font-family="'Poppins', sans-serif">4. Closed Revenue</text>
    <text x="88" y="224" fill="#64748b" font-size="9.5" font-family="'Poppins', sans-serif">Attributed Pipeline</text>
    <text x="235" y="218" fill="#ef5b52" font-size="14" font-weight="700" font-family="'Poppins', sans-serif" text-anchor="end">$1.84M</text>
  </g>

  <!-- Right: Speedometer / ROAS Dial Gauge -->
  <g transform="translate(375, 75)">
    <rect width="195" height="238" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#funnelShadow)"/>
    <text x="97" y="26" fill="#0f172a" font-size="12" font-weight="700" font-family="'Poppins', sans-serif" text-anchor="middle">ROAS Efficiency Dial</text>

    <!-- Semi-Circle Gauge Arc -->
    <g transform="translate(97, 110)">
      <!-- Background Arc -->
      <path d="M -65 0 A 65 65 0 0 1 65 0" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
      <!-- Active Gauge Arc (Green to Coral) -->
      <path d="M -65 0 A 65 65 0 0 1 52 -38" fill="none" stroke="url(#funnel4)" stroke-width="12" stroke-linecap="round"/>
      
      <!-- Needle Indicator -->
      <line x1="0" y1="0" x2="42" y2="-32" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="7" fill="#0f172a"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>

      <!-- Center Big Metric -->
      <text x="0" y="32" fill="#ef5b52" font-size="24" font-weight="800" font-family="'Poppins', sans-serif" text-anchor="middle">4.82x</text>
      <text x="0" y="48" fill="#64748b" font-size="10.5" font-weight="500" font-family="'Poppins', sans-serif" text-anchor="middle">Blended Target ROAS</text>
    </g>

    <!-- Benchmark Comparison -->
    <g transform="translate(18, 185)">
      <rect width="158" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="12" y="16" fill="#64748b" font-size="9.5" font-family="'Poppins', sans-serif">Industry Benchmark: 1.8x</text>
      <text x="12" y="30" fill="#059669" font-size="10.5" font-weight="700" font-family="'Poppins', sans-serif">+167% Performance Lift ▲</text>
    </g>
  </g>

  <!-- Bottom Bar: Zero Data Loss Guarantee -->
  <g transform="translate(32, 342)">
    <rect width="538" height="36" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#10b981"/>
    <text x="32" y="22" fill="#334155" font-size="11" font-weight="600" font-family="'Poppins', sans-serif">Meta CAPI &amp; Google Enhanced Conversions Active • 100% Signal Match</text>
    <rect x="444" y="8" width="82" height="20" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8"/>
    <text x="485" y="22" fill="#059669" font-size="9.5" font-weight="700" font-family="'Poppins', sans-serif" text-anchor="middle">VERIFIED</text>
  </g>
</svg>
