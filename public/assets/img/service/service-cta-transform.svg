<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1329"/>
      <stop offset="50%" stop-color="#141a3d"/>
      <stop offset="100%" stop-color="#241135"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b4bf7"/>
      <stop offset="50%" stop-color="#ef5b52"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef5b52" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7b4bf7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7b4bf7" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Luminous Canvas -->
  <rect width="600" height="400" rx="20" fill="url(#ctaBg)" stroke="#2d3763" stroke-width="1.5"/>

  <!-- Radial Core Glow -->
  <circle cx="300" cy="200" r="180" fill="url(#stageGlow)"/>

  <!-- Header Eyebrow -->
  <g transform="translate(30, 28)">
    <rect width="186" height="26" rx="13" fill="rgba(239,91,82,0.18)" stroke="#ef5b52" stroke-width="1"/>
    <circle cx="13" cy="13" r="4" fill="#ef5b52"/>
    <text x="25" y="17" fill="#ffffff" font-size="10.5" font-weight="700" font-family="'Poppins', sans-serif" letter-spacing="0.05em">AUTONOMOUS GROWTH ENGINE</text>
  </g>

  <!-- Big Title on Graphic -->
  <text x="30" y="85" fill="#ffffff" font-size="20" font-weight="700" font-family="'Poppins', sans-serif">Accelerate Your Revenue Engine</text>
  <text x="30" y="104" fill="#94a3b8" font-size="12" font-family="'Poppins', sans-serif">From Fragmented Ads to a Predictable Growth Infrastructure</text>

  <!-- Growth Trajectory Pathway Beam -->
  <path d="M 60 290 Q 200 270 300 200 T 540 140" fill="none" stroke="url(#beamGrad)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <path d="M 60 290 Q 200 270 300 200 T 540 140" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Step 1 Node: Inbound Ingest -->
  <g transform="translate(60, 240)">
    <circle cx="20" cy="20" r="24" fill="#182047" stroke="#7b4bf7" stroke-width="2"/>
    <text x="20" y="24" fill="#c084fc" font-size="13" font-weight="800" font-family="sans-serif" text-anchor="middle">01</text>
    <rect x="-24" y="52" width="88" height="24" rx="6" fill="#131938" stroke="#252f5c" stroke-width="1"/>
    <text x="20" y="68" fill="#e2e8f0" font-size="10" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Traffic Ingest</text>
  </g>

  <!-- Step 2 Node: AI Intent Engine -->
  <g transform="translate(200, 190)">
    <circle cx="20" cy="20" r="26" fill="#182047" stroke="#de358d" stroke-width="2"/>
    <text x="20" y="24" fill="#f472b6" font-size="13" font-weight="800" font-family="sans-serif" text-anchor="middle">02</text>
    <rect x="-26" y="54" width="92" height="24" rx="6" fill="#131938" stroke="#252f5c" stroke-width="1"/>
    <text x="20" y="70" fill="#e2e8f0" font-size="10" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">AI Qualification</text>
  </g>

  <!-- Step 3 Node: Automated Booking -->
  <g transform="translate(340, 140)">
    <circle cx="20" cy="20" r="26" fill="#182047" stroke="#ef5b52" stroke-width="2"/>
    <text x="20" y="24" fill="#fca5a5" font-size="13" font-weight="800" font-family="sans-serif" text-anchor="middle">03</text>
    <rect x="-26" y="54" width="92" height="24" rx="6" fill="#131938" stroke="#252f5c" stroke-width="1"/>
    <text x="20" y="70" fill="#e2e8f0" font-size="10" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Instant Calendar</text>
  </g>

  <!-- Step 4 Node: Scaled Revenue Victory -->
  <g transform="translate(480, 90)">
    <circle cx="24" cy="24" r="30" fill="url(#beamGrad)" filter="url(#neonGlow)"/>
    <circle cx="24" cy="24" r="28" fill="#10152e"/>
    <text x="24" y="30" fill="#ffffff" font-size="15" font-weight="800" font-family="sans-serif" text-anchor="middle">04</text>
    <rect x="-30" y="60" width="108" height="26" rx="6" fill="#ef5b52" stroke="#ffffff" stroke-width="1"/>
    <text x="24" y="77" fill="#ffffff" font-size="11" font-weight="700" font-family="'Poppins', sans-serif" text-anchor="middle">Closed Sales ▲</text>
  </g>

  <!-- Bottom Brand Trust Stats Row -->
  <g transform="translate(30, 340)">
    <rect width="540" height="42" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <text x="30" y="26" fill="#ffffff" font-size="13" font-weight="700" font-family="'Poppins', sans-serif">100%</text>
    <text x="80" y="26" fill="#94a3b8" font-size="11" font-family="'Poppins', sans-serif">In-House Squad</text>
    <line x1="180" y1="12" x2="180" y2="30" stroke="rgba(255,255,255,0.15)"/>

    <text x="205" y="26" fill="#ffffff" font-size="13" font-weight="700" font-family="'Poppins', sans-serif">50+</text>
    <text x="238" y="26" fill="#94a3b8" font-size="11" font-family="'Poppins', sans-serif">Brands Scaled</text>
    <line x1="330" y1="12" x2="330" y2="30" stroke="rgba(255,255,255,0.15)"/>

    <text x="355" y="26" fill="#10b981" font-size="13" font-weight="700" font-family="'Poppins', sans-serif">Zero</text>
    <text x="395" y="26" fill="#94a3b8" font-size="11" font-family="'Poppins', sans-serif">Outsourced Contractors</text>
  </g>
</svg>
