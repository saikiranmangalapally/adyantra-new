<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <!-- Subtle ambient background glow -->
  <circle cx="160" cy="115" r="90" fill="#fdf2f8" opacity="0.6"/>
  <circle cx="130" cy="80" r="45" fill="#f5f3ff" opacity="0.5"/>

  <!-- Background Decorative Cloud / Flag -->
  <path d="M 60 70 C 60 62, 70 56, 80 58 C 85 52, 98 52, 102 58 C 108 54, 118 56, 120 62 C 126 62, 130 68, 128 74 L 60 74 Z" fill="#e2e8f0" opacity="0.6"/>

  <!-- Upward Scaling Trend Arrow Curve -->
  <path d="M 170 115 C 200 95, 220 70, 248 50" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 2" fill="none"/>
  <polygon points="244,46 254,48 250,58" fill="#10b981"/>

  <!-- Floating Smartphone (Reels / Social Ads) on Floor -->
  <g transform="translate(196, 132)">
    <rect width="24" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="2" y="2" width="20" height="38" rx="3" fill="#ec4899"/>
    <circle cx="12" cy="18" r="4" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Big Target Bullseye with Dart (Matching Reference 2) -->
  <g transform="translate(178, 62)">
    <!-- Outer Ring -->
    <circle cx="28" cy="28" r="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="21" fill="#fee2e2"/>
    <circle cx="28" cy="28" r="14" fill="#ef4444"/>
    <circle cx="28" cy="28" r="7" fill="#ffffff"/>
    <circle cx="28" cy="28" r="3" fill="#ef4444"/>
    <!-- Dart Stuck in Center -->
    <line x1="28" y1="28" x2="48" y2="12" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="44,8 54,10 48,16" fill="#f59e0b"/>
  </g>

  <!-- Winner Podium (1st Place Center Block) -->
  <!-- Block 1 (Main Podium) -->
  <path d="M 166 100 L 214 100 L 214 180 L 166 180 Z" fill="#7c3aed"/>
  <rect x="170" y="104" width="40" height="72" rx="2" fill="#6d28d9"/>
  <!-- Number "1" on Podium -->
  <text x="190" y="138" font-family="'Poppins', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Winner / Specialist Sitting on Podium with Laptop -->
  <!-- Legs hanging off podium -->
  <path d="M 194 116 L 204 116 L 204 136" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Torso (Dark Navy Shirt) -->
  <path d="M 188 88 C 196 86, 202 88, 202 104 L 198 118 L 188 118 Z" fill="#1e1b4b"/>
  <!-- Arm & Laptop -->
  <path d="M 194 96 L 206 104 L 200 108" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Laptop base & screen -->
  <rect x="202" y="102" width="16" height="3" rx="1.5" fill="#94a3b8"/>
  <path d="M 212 102 L 216 92" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head & Hair -->
  <circle cx="194" cy="80" r="7" fill="#fbcfe8"/>
  <path d="M 187 80 C 187 72, 198 70, 202 76 C 203 80, 198 82, 194 82 Z" fill="#475569"/>

  <!-- Left Marketer with Loudspeaker / Megaphone Celebrating -->
  <!-- Legs (Walking towards podium) -->
  <path d="M 124 140 L 118 160 L 114 184" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M 128 140 L 138 162 L 144 184" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Torso (Cyan/Teal Shirt matching reference) -->
  <path d="M 118 106 C 126 102, 136 104, 138 120 L 134 144 L 122 144 Z" fill="#0ea5e9"/>
  <!-- Raised Left Arm holding Megaphone -->
  <path d="M 130 112 L 144 100 L 158 98" stroke="#0ea5e9" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Megaphone (Cyan & Orange) -->
  <g transform="translate(154, 90)">
    <polygon points="4,8 18,2 18,16" fill="#0284c7"/>
    <ellipse cx="18" cy="9" rx="3" ry="7" fill="#f97316"/>
    <rect x="0" y="6" width="6" height="6" rx="2" fill="#1e1b4b"/>
    <path d="M 2 12 L 4 18" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <!-- Sound Waves / Broadcast Hearts -->
    <path d="M 24 5 C 27 7, 27 11, 24 13" stroke="#f97316" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 28 2 C 32 6, 32 12, 28 16" stroke="#f97316" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Head & Hair -->
  <circle cx="126" cy="96" r="7.5" fill="#fbcfe8"/>
  <path d="M 119 96 C 119 88, 130 86, 134 92 C 135 96, 130 98, 126 98 Z" fill="#1e1b4b"/>

  <!-- Viral Reaction Badge (Heart 24k) Floating Top Left -->
  <g transform="translate(72, 82)">
    <rect width="48" height="22" rx="11" fill="#ffffff" stroke="#fce7f3" stroke-width="1.2"/>
    <text x="12" y="15" font-family="'Poppins', sans-serif" font-size="11">❤️</text>
    <text x="26" y="15" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#be123c">24k</text>
  </g>
</svg>
