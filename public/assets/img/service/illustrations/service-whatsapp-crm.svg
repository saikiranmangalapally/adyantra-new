<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <circle cx="160" cy="110" r="90" fill="#f0fdf4" opacity="0.8"/>
  <!-- Smartphone Screen Stage -->
  <rect x="100" y="32" width="120" height="142" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="100" y="32" width="120" height="28" rx="16" fill="#075e54"/>
  <!-- WhatsApp Header Bar -->
  <circle cx="118" cy="46" r="7" fill="#ffffff"/>
  <text x="129" y="47" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">Adyantra AI</text>
  <circle cx="180" cy="46" r="4" fill="#25d366"/>
  <!-- Verified Badge -->
  <path d="M 178 46 L 180 48 L 184 44" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <!-- Chat Messages -->
  <g transform="translate(108, 68)">
    <rect width="85" height="20" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="8" y="13" font-family="'Poppins', sans-serif" font-size="6.5" fill="#1e293b">Hi! Here is your custom plan:</text>
  </g>
  <!-- Product / Offer Card inside Chat -->
  <g transform="translate(108, 92)">
    <rect width="104" height="42" rx="8" fill="#dcf8c6" stroke="#bbf7d0" stroke-width="0.8"/>
    <text x="8" y="14" font-family="'Poppins', sans-serif" font-size="7" font-weight="700" fill="#065f46">Growth Suite Activated</text>
    <text x="8" y="24" font-family="'Poppins', sans-serif" font-size="6" fill="#047857">1-Click Order Confirmation</text>
    <rect x="8" y="28" width="55" height="10" rx="5" fill="#25d366"/>
    <text x="14" y="36" font-family="'Poppins', sans-serif" font-size="5.5" font-weight="700" fill="#ffffff">CONFIRM ORDER</text>
  </g>
  <!-- Floating 98% Open Rate Badge -->
  <g transform="translate(170, 140)">
    <rect width="115" height="30" rx="15" fill="#ffffff" stroke="#25d366" stroke-width="1.5"/>
    <circle cx="16" cy="15" r="9" fill="#25d366"/>
    <text x="12" y="19" font-family="'Poppins', sans-serif" font-size="10" font-weight="900" fill="#ffffff">✓</text>
    <text x="32" y="15" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#0f172a">WhatsApp Business</text>
    <text x="32" y="24" font-family="'Poppins', sans-serif" font-size="8" font-weight="800" fill="#15803d">98% Inbound Open Rate</text>
  </g>
  <rect x="40" y="184" width="240" height="6" rx="3" fill="#cbd5e1"/>
</svg>