<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <!-- Subtle ambient background glow -->
  <circle cx="160" cy="115" r="90" fill="#e0f2fe" opacity="0.6"/>
  <circle cx="225" cy="75" r="45" fill="#ede9fe" opacity="0.45"/>

  <!-- Background Data Streams & Grid Lines -->
  <g transform="translate(45, 36)" stroke="#cbd5e1" stroke-width="1.2" opacity="0.5">
    <line x1="0" y1="20" x2="230" y2="20" stroke-dasharray="3 3"/>
    <line x1="0" y1="50" x2="230" y2="50" stroke-dasharray="3 3"/>
  </g>

  <!-- Big Central Executive Analytics Command Dashboard Screen -->
  <g transform="translate(68, 48)">
    <!-- Monitor Outer Body -->
    <rect width="184" height="114" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <rect width="184" height="24" rx="10" fill="#1e1b4b"/>
    <rect y="14" width="184" height="10" fill="#1e1b4b"/>
    <circle cx="14" cy="12" r="3.5" fill="#ef4444"/>
    <circle cx="24" cy="12" r="3.5" fill="#facc15"/>
    <circle cx="34" cy="12" r="3.5" fill="#10b981"/>
    <text x="50" y="15.5" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">LIVE EXECUTIVE DASHBOARD</text>
    <rect x="144" y="5" width="32" height="14" rx="7" fill="#10b981"/>
    <text x="160" y="14.5" font-family="'Poppins', sans-serif" font-size="7" font-weight="800" fill="#ffffff" text-anchor="middle">LIVE</text>

    <!-- Left Chart: Multi-touch Bar Charts -->
    <g transform="translate(14, 34)">
      <!-- Axis Lines -->
      <line x1="0" y1="62" x2="68" y2="62" stroke="#e2e8f0" stroke-width="1.2"/>
      <!-- Bars -->
      <rect x="6" y="32" width="10" height="30" rx="3" fill="#6366f1"/>
      <rect x="22" y="18" width="10" height="44" rx="3" fill="#3b82f6"/>
      <rect x="38" y="24" width="10" height="38" rx="3" fill="#10b981"/>
      <rect x="54" y="8" width="10" height="54" rx="3" fill="#f59e0b"/>
    </g>

    <!-- Right Chart: Upward ROAS Growth Curve & KPI Card -->
    <g transform="translate(92, 34)">
      <!-- Mini KPI Box -->
      <rect width="78" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="12" font-family="'Poppins', sans-serif" font-size="7" font-weight="500" fill="#64748b">Blended ROAS</text>
      <text x="8" y="23" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#0f172a">4.82x</text>
      <polygon points="56,12 62,6 68,12" fill="#10b981"/>
      <text x="62" y="22" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="700" fill="#059669" text-anchor="middle">+34%</text>

      <!-- Waveform Trendline -->
      <path d="M 6 56 C 24 54, 36 44, 52 46 C 62 48, 70 36, 76 34" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <circle cx="76" cy="34" r="3.5" fill="#f43f5e"/>
    </g>
  </g>

  <!-- Desk Surface -->
  <rect x="52" y="184" width="220" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Character on Right: Intelligence Specialist pointing to insights -->
  <!-- Legs -->
  <path d="M 226 148 L 222 168 L 220 192" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M 234 148 L 238 168 L 242 192" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Torso (Dark Navy Blazer) -->
  <path d="M 222 114 C 230 110, 242 112, 242 126 L 238 150 L 224 150 Z" fill="#0f172a"/>
  <!-- Arm pointing to Dashboard -->
  <path d="M 226 122 L 202 128 L 190 124" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="188" cy="124" r="3" fill="#fbcfe8"/>
  <!-- Head & Hair -->
  <circle cx="232" cy="102" r="7.5" fill="#fbcfe8"/>
  <path d="M 225 102 C 225 94, 236 92, 240 98 C 241 102, 236 104, 232 104 Z" fill="#6366f1"/>

  <!-- Result Floating Pill Badge: GA4 & CAPI INSIGHTS -->
  <g transform="translate(86, 168)">
    <rect width="148" height="24" rx="12" fill="#11142e"/>
    <circle cx="14" cy="12" r="4" fill="#10b981"/>
    <text x="80" y="16" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">GA4 + CAPI ATTRIBUTION</text>
  </g>
</svg>
