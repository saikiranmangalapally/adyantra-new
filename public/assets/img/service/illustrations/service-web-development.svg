<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <!-- Subtle ambient background glow -->
  <circle cx="160" cy="115" r="90" fill="#ede9fe" opacity="0.5"/>
  <circle cx="210" cy="70" r="45" fill="#e0f2fe" opacity="0.5"/>

  <!-- Large Floating Browser / Code Editor Window in Background -->
  <g transform="translate(68, 48)">
    <rect width="184" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Browser Top Bar -->
    <rect width="184" height="18" rx="8" fill="#f1f5f9"/>
    <circle cx="12" cy="9" r="3" fill="#f87171"/>
    <circle cx="22" cy="9" r="3" fill="#facc15"/>
    <circle cx="32" cy="9" r="3" fill="#4ade80"/>
    <rect x="48" y="4" width="90" height="10" rx="3" fill="#ffffff"/>
    
    <!-- Code Editor Split View -->
    <!-- Left Sidebar -->
    <rect x="0" y="18" width="42" height="98" fill="#1e1b4b"/>
    <line x1="8" y1="30" x2="34" y2="30" stroke="#818cf8" stroke-width="2"/>
    <line x1="8" y1="40" x2="28" y2="40" stroke="#64748b" stroke-width="2"/>
    <line x1="8" y1="50" x2="32" y2="50" stroke="#64748b" stroke-width="2"/>
    <line x1="8" y1="60" x2="24" y2="60" stroke="#64748b" stroke-width="2"/>

    <!-- Code Editor Main View -->
    <rect x="42" y="18" width="142" height="98" fill="#0f172a"/>
    <text x="52" y="36" font-family="monospace" font-size="9" fill="#38bdf8">&lt;App /&gt;</text>
    <text x="52" y="52" font-family="monospace" font-size="8.5" fill="#a855f7">const <tspan fill="#f59e0b">scale</tspan> = <tspan fill="#34d399">10x</tspan>;</text>
    <text x="52" y="68" font-family="monospace" font-size="8.5" fill="#94a3b8">return &lt;<tspan fill="#60a5fa">NextPage</tspan>&gt;;</text>

    <!-- Floating Component Card Inside -->
    <g transform="translate(108, 64)">
      <rect width="66" height="42" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
      <rect x="6" y="6" width="30" height="8" rx="2" fill="#3b82f6"/>
      <line x1="6" y1="20" x2="56" y2="20" stroke="#e2e8f0" stroke-width="2"/>
      <line x1="6" y1="28" x2="44" y2="28" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="54" cy="34" r="3" fill="#10b981"/>
    </g>
  </g>

  <!-- Cloud Database Sync Cylinder at Top Left -->
  <g transform="translate(36, 68)">
    <ellipse cx="18" cy="8" rx="18" ry="6" fill="#7c3aed"/>
    <path d="M 0 8 L 0 24 A 18 6 0 0 0 36 24 L 36 8 Z" fill="#6d28d9"/>
    <ellipse cx="18" cy="24" rx="18" ry="6" fill="#7c3aed"/>
    <path d="M 0 24 L 0 40 A 18 6 0 0 0 36 40 L 36 24 Z" fill="#5b21b6"/>
    <ellipse cx="18" cy="40" rx="18" ry="6" fill="#6d28d9"/>
    <circle cx="28" cy="32" r="2.5" fill="#34d399"/>
  </g>

  <!-- Software Engineer Sitting with Modern Workstation -->
  <!-- Desk Base -->
  <rect x="140" y="174" width="130" height="5" rx="2.5" fill="#cbd5e1"/>

  <!-- Character (Developer) -->
  <!-- Legs -->
  <path d="M 186 142 L 180 162 L 178 184" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M 194 142 L 198 162 L 204 184" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Torso (Indigo Hoodie) -->
  <path d="M 182 110 C 190 106, 200 108, 202 122 L 198 144 L 186 144 Z" fill="#6366f1"/>
  <!-- Arm & Laptop -->
  <path d="M 190 118 L 204 126 L 214 126" stroke="#6366f1" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Laptop on Lap/Stand -->
  <rect x="210" y="128" width="22" height="4" rx="2" fill="#94a3b8"/>
  <path d="M 224 128 L 228 114" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head & Glasses -->
  <circle cx="188" cy="98" r="7.5" fill="#fbcfe8"/>
  <path d="M 181 98 C 181 90, 192 88, 196 94 C 197 98, 192 100, 188 100 Z" fill="#1e1b4b"/>
  <!-- Glasses -->
  <rect x="190" y="96" width="5" height="4" rx="1" fill="none" stroke="#1e1b4b" stroke-width="1"/>

  <!-- React / Tech Atom Icon at Top Right -->
  <g transform="translate(242, 42)" stroke="#0284c7" stroke-width="1.5" fill="none">
    <ellipse cx="16" cy="16" rx="16" ry="6"/>
    <ellipse cx="16" cy="16" rx="16" ry="6" transform="rotate(60 16 16)"/>
    <ellipse cx="16" cy="16" rx="16" ry="6" transform="rotate(120 16 16)"/>
    <circle cx="16" cy="16" r="3" fill="#0284c7"/>
  </g>
</svg>
