<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <!-- Subtle ambient background glow -->
  <circle cx="160" cy="110" r="90" fill="#f5f3ff" opacity="0.6"/>
  <circle cx="210" cy="80" r="45" fill="#fef3c7" opacity="0.4"/>

  <!-- Decorative Background Elements -->
  <!-- Gear 1 -->
  <g transform="translate(36, 42) scale(0.7)" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc">
    <circle cx="20" cy="20" r="14"/>
    <path d="M20 2 v4 M20 34 v4 M2 20 h4 M34 20 h4 M7.5 7.5 l3 3 M29.5 29.5 l3 3 M7.5 32.5 l3 -3 M29.5 10.5 l3 -3"/>
  </g>
  <!-- Gear 2 -->
  <g transform="translate(24, 76) scale(0.5)" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc">
    <circle cx="20" cy="20" r="14"/>
    <path d="M20 2 v4 M20 34 v4 M2 20 h4 M34 20 h4 M7.5 7.5 l3 3 M29.5 29.5 l3 3 M7.5 32.5 l3 -3 M29.5 10.5 l3 -3"/>
  </g>

  <!-- Golden Stars & Rank Badges -->
  <g fill="#f59e0b" transform="translate(68, 52) scale(0.85)">
    <polygon points="10,1 12.5,7 19,7.5 14,12 15.5,18.5 10,15 4.5,18.5 6,12 1,7.5 7.5,7"/>
  </g>
  <g fill="#f59e0b" transform="translate(90, 48) scale(0.7)">
    <polygon points="10,1 12.5,7 19,7.5 14,12 15.5,18.5 10,15 4.5,18.5 6,12 1,7.5 7.5,7"/>
  </g>
  <g fill="#f59e0b" transform="translate(110, 52) scale(0.85)">
    <polygon points="10,1 12.5,7 19,7.5 14,12 15.5,18.5 10,15 4.5,18.5 6,12 1,7.5 7.5,7"/>
  </g>

  <!-- #1 Rank Badge with Flame -->
  <g transform="translate(38, 92)">
    <rect width="36" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="18" y="15.5" font-family="'Poppins', sans-serif" font-size="12" font-weight="800" fill="#4338ca" text-anchor="middle">#1</text>
  </g>

  <!-- Code Bracket Tag -->
  <g transform="translate(24, 134)">
    <rect width="34" height="22" rx="6" fill="#1e1b4b"/>
    <text x="17" y="15" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Magnifying Globe Grid on Right -->
  <g transform="translate(230, 48)" opacity="0.35" stroke="#94a3b8" stroke-width="1.2">
    <circle cx="28" cy="28" r="24" fill="none"/>
    <ellipse cx="28" cy="28" rx="12" ry="24" fill="none"/>
    <line x1="4" y1="28" x2="52" y2="28"/>
    <line x1="8" y1="16" x2="48" y2="16"/>
    <line x1="8" y1="40" x2="48" y2="40"/>
  </g>

  <!-- Desk Surface -->
  <rect x="52" y="174" width="220" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Desktop Computer Stand & Monitor -->
  <!-- Stand base & neck -->
  <rect x="138" y="156" width="16" height="20" fill="#94a3b8" rx="2"/>
  <rect x="124" y="172" width="44" height="5" rx="2.5" fill="#64748b"/>
  <!-- Monitor Outer Body -->
  <rect x="76" y="80" width="140" height="88" rx="10" fill="#1e1b4b" stroke="#312e81" stroke-width="2"/>
  <!-- Monitor Inner Screen -->
  <rect x="82" y="86" width="128" height="74" rx="6" fill="#3b82f6"/>
  <!-- Top Bar inside screen -->
  <rect x="82" y="86" width="128" height="12" rx="3" fill="#2563eb"/>
  <circle cx="89" cy="92" r="2.5" fill="#f87171"/>
  <circle cx="97" cy="92" r="2.5" fill="#facc15"/>
  <circle cx="105" cy="92" r="2.5" fill="#4ade80"/>

  <!-- SEO Main Screen Cloud Banner (Orange as in reference) -->
  <path d="M 102 124 C 98 120, 98 112, 106 108 C 110 102, 122 100, 128 106 C 132 102, 144 102, 148 108 C 156 108, 160 114, 158 122 C 162 126, 160 134, 154 136 C 150 140, 106 140, 102 124 Z" fill="#f97316"/>
  <text x="132" y="126" font-family="'Poppins', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">SEO</text>

  <!-- Mini Search Input Bar inside Monitor -->
  <rect x="94" y="138" width="104" height="14" rx="7" fill="#ffffff"/>
  <circle cx="102" cy="145" r="3" fill="#3b82f6"/>
  <line x1="108" y1="145" x2="164" y2="145" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="174" y="140.5" width="20" height="9" rx="4.5" fill="#f97316"/>

  <!-- Rocket Launching from Monitor Screen -->
  <g transform="translate(142, 60) rotate(-15)">
    <!-- Rocket Body -->
    <path d="M 10 0 C 18 10, 18 24, 10 32 C 2 24, 2 10, 10 0 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Rocket Nosecone -->
    <path d="M 10 0 C 15 6, 15 10, 10 12 C 5 10, 5 6, 10 0 Z" fill="#ef4444"/>
    <!-- Rocket Window -->
    <circle cx="10" cy="18" r="3.5" fill="#38bdf8"/>
    <!-- Rocket Fins -->
    <path d="M 3 24 L -1 30 L 4 30 Z" fill="#f97316"/>
    <path d="M 17 24 L 21 30 L 16 30 Z" fill="#f97316"/>
    <!-- Flame Exhaust -->
    <path d="M 7 32 C 10 40, 10 40, 13 32 Z" fill="#facc15"/>
    <path d="M 8 32 C 10 37, 10 37, 12 32 Z" fill="#ef4444"/>
  </g>

  <!-- Person (Developer/SEO Specialist) Sitting on Chair -->
  <!-- Chair Back & Seat -->
  <rect x="216" y="128" width="8" height="42" rx="4" fill="#64748b"/>
  <rect x="194" y="162" width="34" height="6" rx="3" fill="#475569"/>
  <!-- Chair Pole & Wheels -->
  <line x1="210" y1="168" x2="210" y2="188" stroke="#475569" stroke-width="3"/>
  <line x1="198" y1="188" x2="222" y2="188" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <circle cx="198" cy="190" r="2.5" fill="#1e293b"/>
  <circle cx="222" cy="190" r="2.5" fill="#1e293b"/>

  <!-- Character Body: Purple shirt & dark trousers matching reference -->
  <!-- Legs -->
  <path d="M 204 158 L 194 176 L 178 176" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Torso (Purple Shirt) -->
  <path d="M 198 126 C 206 124, 214 126, 214 140 L 208 160 L 196 160 Z" fill="#7c3aed"/>
  <!-- Arm typing on keyboard -->
  <path d="M 206 132 L 186 144 L 170 144" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Hand -->
  <circle cx="168" cy="144" r="3" fill="#fbcfe8"/>
  <!-- Head & Hair -->
  <circle cx="204" cy="114" r="7.5" fill="#fbcfe8"/>
  <path d="M 197 114 C 196 106, 208 104, 212 110 C 213 114, 208 116, 204 116 Z" fill="#1e1b4b"/>
  <!-- Face Profile -->
  <circle cx="201" cy="114" r="1.2" fill="#1e1b4b"/>
</svg>
