<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <!-- Subtle ambient background glow -->
  <circle cx="160" cy="115" r="90" fill="#ede9fe" opacity="0.6"/>
  <circle cx="210" cy="80" r="45" fill="#dcfce7" opacity="0.5"/>

  <!-- Friendly AI Robot Assistant in Center -->
  <g transform="translate(142, 60)">
    <!-- Antenna -->
    <line x1="26" y1="2" x2="26" y2="12" stroke="#7c3aed" stroke-width="2.5"/>
    <circle cx="26" cy="2" r="3.5" fill="#10b981"/>

    <!-- Robot Head -->
    <rect x="6" y="12" width="40" height="32" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <!-- Glowing Visor / Eyes Screen -->
    <rect x="12" y="18" width="28" height="14" rx="6" fill="#1e1b4b"/>
    <!-- Glowing Cyan Eyes -->
    <circle cx="20" cy="25" r="3" fill="#38bdf8"/>
    <circle cx="32" cy="25" r="3" fill="#38bdf8"/>
    <!-- Cute Smile -->
    <path d="M 22 38 Q 26 41 30 38" stroke="#7c3aed" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Robot Ears / Sensors -->
    <rect x="1" y="22" width="5" height="12" rx="2" fill="#7c3aed"/>
    <rect x="46" y="22" width="5" height="12" rx="2" fill="#7c3aed"/>

    <!-- Robot Body -->
    <rect x="10" y="48" width="32" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <!-- Chest Screen with AI Pulse Wave -->
    <rect x="16" y="54" width="20" height="14" rx="4" fill="#ede9fe"/>
    <path d="M 18 61 L 22 61 L 24 57 L 27 65 L 29 61 L 34 61" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Core Indicator Light -->
    <circle cx="26" cy="76" r="3" fill="#10b981"/>

    <!-- Robot Arms -->
    <path d="M 10 54 Q 2 62 6 72" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="6" cy="72" r="3" fill="#7c3aed"/>
    <path d="M 42 54 Q 50 62 46 72" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="46" cy="72" r="3" fill="#7c3aed"/>

    <!-- Hover Glow / Thruster Base -->
    <ellipse cx="26" cy="94" rx="14" ry="4" fill="#cbd5e1"/>
    <path d="M 18 86 L 22 92 L 30 92 L 34 86 Z" fill="#64748b"/>
  </g>

  <!-- Left: WhatsApp / Customer Chat Bubble -->
  <g transform="translate(42, 54)">
    <rect width="84" height="42" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M 84 26 L 94 32 L 84 36 Z" fill="#ffffff"/>
    <!-- WhatsApp Icon Mini -->
    <circle cx="16" cy="18" r="7" fill="#22c55e"/>
    <text x="16" y="21" font-family="'Poppins', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">✆</text>
    <!-- Message Lines -->
    <rect x="28" y="14" width="46" height="4" rx="2" fill="#1e1b4b"/>
    <rect x="28" y="22" width="34" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Right: Automated AI Response Chat Bubble -->
  <g transform="translate(198, 76)">
    <rect width="90" height="46" rx="12" fill="#7c3aed"/>
    <path d="M 0 20 L -8 26 L 0 30 Z" fill="#7c3aed"/>
    <!-- Fast Instant AI Tag -->
    <text x="14" y="18" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="800" fill="#facc15">⚡ INSTANT LEAD</text>
    <rect x="14" y="24" width="62" height="4" rx="2" fill="#ffffff"/>
    <rect x="14" y="32" width="48" height="4" rx="2" fill="#e9d5ff"/>
  </g>

  <!-- Happy Customer Chatting on Smartphone on Left -->
  <!-- Legs -->
  <path d="M 88 144 L 84 166 L 82 186" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 94 144 L 98 166 L 102 186" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Torso (Lavender Top) -->
  <path d="M 82 112 C 90 108, 98 110, 100 124 L 96 146 L 84 146 Z" fill="#7c3aed"/>
  <!-- Arm holding phone -->
  <path d="M 92 118 L 106 124 L 114 122" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Smartphone -->
  <rect x="112" y="116" width="10" height="18" rx="2" fill="#1e1b4b"/>
  <!-- Head & Hair -->
  <circle cx="88" cy="102" r="7.5" fill="#fbcfe8"/>
  <path d="M 81 102 C 81 94, 92 92, 96 98 C 97 102, 92 104, 88 104 Z" fill="#1e1b4b"/>
</svg>
