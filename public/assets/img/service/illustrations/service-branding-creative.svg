<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <circle cx="160" cy="110" r="90" fill="#fff1f2" opacity="0.8"/>
  <!-- Brand Identity Stylebook Stage -->
  <rect x="65" y="40" width="190" height="128" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="65" y="40" width="190" height="24" rx="10" fill="#0f172a"/>
  <text x="80" y="56" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#f43f5e">Brand Identity &amp; Creative Guidelines</text>
  <!-- Logo Geometry Stage -->
  <g transform="translate(85, 75)">
    <rect width="55" height="55" rx="8" fill="#0f172a"/>
    <polygon points="112,85 130,118 94,118" fill="#f43f5e"/>
    <circle cx="112" cy="102" r="6" fill="#ffffff"/>
  </g>
  <!-- Palette Swatches -->
  <g transform="translate(155, 75)">
    <circle cx="12" cy="12" r="10" fill="#f43f5e"/>
    <circle cx="36" cy="12" r="10" fill="#0f172a"/>
    <circle cx="60" cy="12" r="10" fill="#3b82f6"/>
    <circle cx="84" cy="12" r="10" fill="#10b981"/>
    <!-- Typography Specs -->
    <text x="5" y="38" font-family="'Poppins', sans-serif" font-size="9" font-weight="800" fill="#0f172a">Aa Bb Gg</text>
    <text x="5" y="48" font-family="'Poppins', sans-serif" font-size="6.5" fill="#64748b">Primary Font: Inter / Outfit</text>
  </g>
  <!-- Brand Authority Metric -->
  <g transform="translate(145, 140)">
    <rect width="135" height="30" rx="15" fill="#ffffff" stroke="#f43f5e" stroke-width="1.4"/>
    <circle cx="16" cy="15" r="9" fill="#f43f5e"/>
    <text x="13" y="19" font-family="'Poppins', sans-serif" font-size="10" font-weight="900" fill="#ffffff">◆</text>
    <text x="32" y="15" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#0f172a">Distinct Identity System</text>
    <text x="32" y="24" font-family="'Poppins', sans-serif" font-size="8" font-weight="800" fill="#e11d48">100% Brand Recall</text>
  </g>
  <rect x="40" y="184" width="240" height="6" rx="3" fill="#cbd5e1"/>
</svg>