<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <!-- Subtle ambient background glow -->
  <circle cx="160" cy="115" r="90" fill="#f5f3ff" opacity="0.6"/>
  <circle cx="160" cy="65" r="45" fill="#fef3c7" opacity="0.4"/>

  <!-- Partner Network Tree Nodes in Background -->
  <g transform="translate(100, 36)" stroke="#cbd5e1" stroke-width="1.5">
    <line x1="60" y1="20" x2="20" y2="50"/>
    <line x1="60" y1="20" x2="100" y2="50"/>
    <line x1="20" y1="50" x2="0" y2="70"/>
    <line x1="20" y1="50" x2="40" y2="70"/>
    <line x1="100" y1="50" x2="80" y2="70"/>
    <line x1="100" y1="50" x2="120" y2="70"/>

    <!-- Nodes -->
    <circle cx="60" cy="20" r="10" fill="#7c3aed" stroke="none"/>
    <circle cx="20" cy="50" r="7" fill="#3b82f6" stroke="none"/>
    <circle cx="100" cy="50" r="7" fill="#10b981" stroke="none"/>
    <circle cx="0" cy="70" r="5" fill="#f59e0b" stroke="none"/>
    <circle cx="40" cy="70" r="5" fill="#ec4899" stroke="none"/>
    <circle cx="80" cy="70" r="5" fill="#8b5cf6" stroke="none"/>
    <circle cx="120" cy="70" r="5" fill="#06b6d4" stroke="none"/>
  </g>

  <!-- Big Gold Commission % Badge in Center -->
  <g transform="translate(136, 68)">
    <circle cx="24" cy="24" r="22" fill="#f59e0b"/>
    <circle cx="24" cy="24" r="18" fill="#fbbf24"/>
    <text x="24" y="32" font-family="'Poppins', sans-serif" font-size="19" font-weight="900" fill="#78350f" text-anchor="middle">%</text>
  </g>

  <!-- Left Partner Shaking Hands -->
  <!-- Legs -->
  <path d="M 108 142 L 102 164 L 98 186" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M 114 142 L 118 164 L 122 186" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Torso (Indigo Suit) -->
  <path d="M 104 110 C 112 106, 122 108, 122 122 L 118 144 L 106 144 Z" fill="#6366f1"/>
  <!-- Arm extended for handshake -->
  <path d="M 116 116 L 136 128 L 152 128" stroke="#6366f1" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="154" cy="128" r="3" fill="#fbcfe8"/>
  <!-- Head & Hair -->
  <circle cx="108" cy="98" r="7.5" fill="#fbcfe8"/>
  <path d="M 101 98 C 101 90, 112 88, 116 94 C 117 98, 112 100, 108 100 Z" fill="#1e1b4b"/>

  <!-- Right Partner Shaking Hands -->
  <!-- Legs -->
  <path d="M 212 142 L 206 164 L 202 186" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M 218 142 L 222 164 L 226 186" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Torso (Dark Navy Suit) -->
  <path d="M 208 110 C 216 106, 226 108, 226 122 L 222 144 L 210 144 Z" fill="#1e1b4b"/>
  <!-- Arm extended for handshake -->
  <path d="M 212 116 L 186 128 L 164 128" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="162" cy="128" r="3" fill="#fbcfe8"/>
  <!-- Head & Hair -->
  <circle cx="218" cy="98" r="7.5" fill="#fbcfe8"/>
  <path d="M 211 98 C 211 90, 222 88, 226 94 C 227 98, 222 100, 218 100 Z" fill="#7c3aed"/>

  <!-- Firm Handshake Clasp in Center -->
  <rect x="150" y="124" width="16" height="8" rx="4" fill="#fbcfe8"/>
  <path d="M 152 126 L 164 126" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Revenue Multiplier Floating Tag at Bottom Center -->
  <g transform="translate(120, 154)">
    <rect width="80" height="24" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
    <text x="40" y="16" font-family="'Poppins', sans-serif" font-size="9" font-weight="800" fill="#10b981" text-anchor="middle">★ +42% ROAS</text>
  </g>
</svg>
