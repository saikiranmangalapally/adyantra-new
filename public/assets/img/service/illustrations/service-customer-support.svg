  <rect x="75" y="40" width="170" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="75" y="40" width="170" height="24" rx="10" fill="#1e293b"/>
  <circle cx="90" cy="52" r="3.5" fill="#ef4444"/>
  <circle cx="100" cy="52" r="3.5" fill="#f59e0b"/>
