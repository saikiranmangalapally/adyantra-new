<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <!-- Subtle ambient background glow -->
  <circle cx="160" cy="115" r="90" fill="#f0fdf4" opacity="0.7"/>
  <circle cx="210" cy="75" r="45" fill="#fef3c7" opacity="0.45"/>

  <!-- Background Radar / Target Rings -->
  <g transform="translate(160, 80)" stroke="#cbd5e1" stroke-width="1.2" opacity="0.5">
    <circle cx="0" cy="0" r="60" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="38"/>
    <circle cx="0" cy="0" r="18"/>
  </g>

  <!-- High-Intent Magnet pulling Leads (Left Top) -->
  <g transform="translate(42, 42) rotate(22)">
    <path d="M 0 15 C 0 0, 36 0, 36 15 L 36 40 L 24 40 L 24 16 C 24 10, 12 10, 12 16 L 12 40 L 0 40 Z" fill="#ef4444"/>
    <rect x="0" y="32" width="12" height="8" fill="#e2e8f0"/>
    <rect x="24" y="32" width="12" height="8" fill="#e2e8f0"/>
    <!-- Magnetic pull waves -->
    <path d="M 6 46 Q 18 52 30 46" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 3 52 Q 18 60 33 52" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Verified Lead User Badges Floating in Ingestion Stage -->
  <g transform="translate(86, 78)">
    <rect width="66" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="13" cy="13" r="8" fill="#10b981"/>
    <path d="M 9.5 13 L 12 15.5 L 16.5 10.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="16.5" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#0f172a">VP Tech</text>
  </g>

  <g transform="translate(196, 48)">
    <rect width="78" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="13" cy="13" r="8" fill="#3b82f6"/>
    <path d="M 9.5 13 L 12 15.5 L 16.5 10.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="16.5" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#0f172a">D2C Buyer</text>
  </g>

  <!-- Central Conversion Funnel -->
  <g transform="translate(120, 85)">
    <!-- Outer Funnel Shell -->
    <polygon points="0,15 80,15 54,65 26,65" fill="#6366f1" opacity="0.9"/>
    <!-- Top Rim Oval -->
    <ellipse cx="40" cy="15" rx="40" ry="10" fill="#818cf8"/>
    <ellipse cx="40" cy="15" rx="34" ry="7" fill="#4f46e5"/>
    
    <!-- Filter Chamber -->
    <rect x="28" y="65" width="24" height="28" rx="4" fill="#1e1b4b"/>
    <!-- Flow Dots -->
    <circle cx="40" cy="74" r="3" fill="#34d399"/>
    <circle cx="40" cy="83" r="3.5" fill="#facc15"/>
    
    <!-- Outflow Lead Pipeline -->
    <path d="M 40 93 L 40 102" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Desk Surface -->
  <rect x="52" y="184" width="220" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Character on Right guiding Qualified Leads -->
  <!-- Legs -->
  <path d="M 218 148 L 214 168 L 212 192" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M 226 148 L 230 168 L 234 192" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Torso (Emerald Jacket) -->
  <path d="M 214 114 C 222 110, 234 112, 234 126 L 230 150 L 216 150 Z" fill="#10b981"/>
  <!-- Arm pointing to funnel -->
  <path d="M 218 122 L 194 112 L 180 116" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="178" cy="116" r="3" fill="#fbcfe8"/>
  <!-- Head & Hair -->
  <circle cx="224" cy="102" r="7.5" fill="#fbcfe8"/>
  <path d="M 217 102 C 217 94, 228 92, 232 98 C 233 102, 228 104, 224 104 Z" fill="#1e1b4b"/>

  <!-- Result Floating Pill Badge: +180% Verified Leads -->
  <g transform="translate(100, 168)">
    <rect width="118" height="24" rx="12" fill="#11142e"/>
    <circle cx="12" cy="12" r="4" fill="#10b981"/>
    <text x="64" y="16" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="middle">+180% LEADS</text>
  </g>
</svg>
