<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <!-- Subtle ambient background glow -->
  <circle cx="160" cy="115" r="90" fill="#ede9fe" opacity="0.6"/>
  <circle cx="95" cy="75" r="45" fill="#e0e7ff" opacity="0.45"/>

  <!-- Background Database Cloud & Sync Links -->
  <g transform="translate(130, 36)" stroke="#cbd5e1" stroke-width="1.5">
    <!-- Cloud base -->
    <path d="M 16 28 C 6 28, 0 20, 4 12 C 6 4, 18 2, 26 6 C 32 0, 48 2, 50 12 C 58 14, 58 28, 48 28 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Sync arrows inside cloud -->
    <path d="M 22 18 A 6 6 0 1 1 34 18" stroke="#7c3aed" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <polyline points="32 14, 34 18, 30 19" fill="#7c3aed"/>
  </g>

  <!-- Left: CRM Database Node (HubSpot / Pipeline node) -->
  <g transform="translate(42, 54)">
    <rect width="64" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="8" y="10" width="20" height="6" rx="3" fill="#ff7a59"/>
    <line x1="8" y1="22" x2="52" y2="22" stroke="#e2e8f0" stroke-width="2.5"/>
    <line x1="8" y1="30" x2="38" y2="30" stroke="#e2e8f0" stroke-width="2.5"/>
    <circle cx="48" cy="12" r="4" fill="#10b981"/>
  </g>

  <!-- Right: CRM Database Node (Salesforce / Deals node) -->
  <g transform="translate(214, 54)">
    <rect width="64" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="8" y="10" width="20" height="6" rx="3" fill="#00a1e0"/>
    <line x1="8" y1="22" x2="52" y2="22" stroke="#e2e8f0" stroke-width="2.5"/>
    <line x1="8" y1="30" x2="38" y2="30" stroke="#e2e8f0" stroke-width="2.5"/>
    <circle cx="48" cy="12" r="4" fill="#3b82f6"/>
  </g>

  <!-- Dynamic Sync Connecting Lines with Lightning Bolt -->
  <path d="M 106 75 L 140 75" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M 180 75 L 214 75" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Automation Trigger Hub in Center -->
  <g transform="translate(142, 58)">
    <circle cx="18" cy="18" r="18" fill="#1e1b4b"/>
    <!-- Yellow Lightning Bolt -->
    <polygon points="19,6 11,20 18,20 17,30 25,16 18,16" fill="#facc15"/>
  </g>

  <!-- Large Central Synced Contact / Deal Profile Card -->
  <g transform="translate(94, 98)">
    <rect width="132" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Card Top Header -->
    <rect width="132" height="22" rx="10" fill="#f8fafc"/>
    <rect y="12" width="132" height="10" fill="#f8fafc"/>
    <circle cx="16" cy="11" r="5" fill="#6366f1"/>
    <text x="28" y="15" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">Deal: Enterprise SLA</text>
    
    <!-- Deal Metrics -->
    <text x="14" y="38" font-family="'Poppins', sans-serif" font-size="8" font-weight="500" fill="#64748b">Pipeline Stage</text>
    <rect x="76" y="28" width="46" height="15" rx="7.5" fill="#ecfdf5"/>
    <text x="99" y="39" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#059669" text-anchor="middle">Qualified</text>

    <!-- Deal Value & Contact -->
    <line x1="14" y1="48" x2="118" y2="48" stroke="#f1f5f9" stroke-width="1.2"/>
    <text x="14" y="62" font-family="'Poppins', sans-serif" font-size="8" font-weight="500" fill="#64748b">Value:</text>
    <text x="44" y="63" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">$24,500</text>
    <!-- Sync Checkmark Circle -->
    <circle cx="108" cy="61" r="7" fill="#10b981"/>
    <path d="M 105 61 L 107 63 L 111 59" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Desk Surface -->
  <rect x="52" y="184" width="220" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Character on Left: Engineer automating workflows -->
  <!-- Legs -->
  <path d="M 66 148 L 62 168 L 60 192" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M 74 148 L 78 168 L 82 192" stroke="#1e1b4b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Torso (Violet/Indigo Shirt) -->
  <path d="M 62 114 C 70 110, 82 112, 82 126 L 78 150 L 64 150 Z" fill="#7c3aed"/>
  <!-- Arm pointing to CRM Card -->
  <path d="M 72 122 L 90 128 L 98 126" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="126" r="3" fill="#fbcfe8"/>
  <!-- Head & Hair -->
  <circle cx="72" cy="102" r="7.5" fill="#fbcfe8"/>
  <path d="M 65 102 C 65 94, 76 92, 80 98 C 81 102, 76 104, 72 104 Z" fill="#1e1b4b"/>

  <!-- Result Floating Pill Badge: 100% CRM SYNC -->
  <g transform="translate(100, 168)">
    <rect width="120" height="24" rx="12" fill="#11142e"/>
    <circle cx="14" cy="12" r="4" fill="#38bdf8"/>
    <text x="66" y="16" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">100% CRM SYNC</text>
  </g>
</svg>
