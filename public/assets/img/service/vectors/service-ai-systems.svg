<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <linearGradient id="aiSysCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="agentNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="aiSysCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="380" height="200" rx="14" fill="url(#aiSysCanvasBg)"/>

  <!-- Main System Frame -->
  <g transform="translate(24, 16)" filter="url(#aiSysCardShadow)">
    <rect width="332" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header status bar -->
    <g transform="translate(14, 12)">
      <rect width="168" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
      <circle cx="11" cy="11" r="3.5" fill="#10b981"/>
      <text x="21" y="15" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#047857">AUTONOMOUS WORKFLOWS</text>

      <rect x="220" y="0" width="84" height="22" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="262" y="14.5" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="800" fill="#15803d" text-anchor="middle">&lt; 2.4s Sync</text>
    </g>

    <!-- 3 Connected Nodes Grid -->
    <g transform="translate(14, 46)">
      <!-- Node 1: Inbound Webhook -->
      <g transform="translate(0, 8)" filter="url(#aiSysCardShadow)">
        <rect width="86" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="43" cy="24" r="12" fill="#eff6ff"/>
        <path d="M37 24 L49 24 M43 18 L43 30" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
        <text x="43" y="52" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Inbound</text>
        <text x="43" y="64" font-family="'Poppins', sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Webhooks &amp; Ads</text>
        <rect x="10" y="72" width="66" height="16" rx="4" fill="#f1f5f9"/>
        <text x="43" y="83.5" font-family="'Poppins', sans-serif" font-size="7" font-weight="600" fill="#475569" text-anchor="middle">Instant 0s</text>
      </g>

      <!-- Connector 1 -->
      <path d="M 88 56 L 102 56" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="100 52, 106 56, 100 60" fill="#10b981"/>

      <!-- Node 2: Central AI Reasoning Agent (Hero) -->
      <g transform="translate(108, 0)" filter="url(#aiSysCardShadow)">
        <rect width="94" height="112" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="47" cy="28" r="16" fill="url(#agentNodeGrad)"/>
        <!-- Brain / Chip Icon -->
        <circle cx="47" cy="28" r="6" fill="#ffffff"/>
        <circle cx="47" cy="28" r="3" fill="#059669"/>
        
        <text x="47" y="60" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#0f172a" text-anchor="middle">AI Agent</text>
        <text x="47" y="72" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="600" fill="#059669" text-anchor="middle">Multi-Step Logic</text>
        <rect x="8" y="82" width="78" height="20" rx="5" fill="#ecfdf5"/>
        <text x="47" y="95.5" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#047857" text-anchor="middle">RAG Grounded</text>
      </g>

      <!-- Connector 2 -->
      <path d="M 204 56 L 218 56" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="216 52, 222 56, 216 60" fill="#10b981"/>

      <!-- Node 3: CRM Lock -->
      <g transform="translate(224, 8)" filter="url(#aiSysCardShadow)">
        <rect width="80" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="40" cy="24" r="12" fill="#ecfdf5"/>
        <polyline points="34 24, 38 28, 46 20" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="40" y="52" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">CRM Lock</text>
        <text x="40" y="64" font-family="'Poppins', sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">HubSpot Sync</text>
        <rect x="8" y="72" width="64" height="16" rx="4" fill="#f0fdf4"/>
        <text x="40" y="83.5" font-family="'Poppins', sans-serif" font-size="7" font-weight="700" fill="#16a34a" text-anchor="middle">0% Leakage</text>
      </g>
    </g>
  </g>
</svg>
