<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ppcCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fffbf5"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="ppcTrendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef5b52"/>
      <stop offset="100%" stop-color="#7b4bf7"/>
    </linearGradient>
    <filter id="ppcCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="380" height="200" rx="14" fill="url(#ppcCanvasBg)"/>

  <!-- Top: Google Ads Sponsored Result Snippet -->
  <g transform="translate(24, 16)" filter="url(#ppcCardShadow)">
    <rect width="332" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Sponsored Label & URL -->
    <text x="14" y="18" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">Sponsored</text>
    <text x="68" y="18" font-family="'Poppins', sans-serif" font-size="8.5" fill="#64748b">https://adyantra.in/ppc-ads</text>
    
    <!-- Ad Badge -->
    <rect x="264" y="6" width="56" height="20" rx="4" fill="#ef5b52"/>
    <text x="292" y="19" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">#1 TOP AD</text>

    <!-- Ad Headline -->
    <text x="14" y="38" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#1e40af">Google Ads Performance Max &amp; High-ROAS Search</text>
  </g>

  <!-- Bottom: PPC Growth & ROI Analytics Dashboard -->
  <g transform="translate(24, 76)">
    <!-- Left: Ad Spend vs Revenue Scaling Bar Pillars -->
    <g filter="url(#ppcCardShadow)">
      <rect width="186" height="106" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <text x="14" y="20" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#64748b">Revenue Multiplier</text>
      
      <!-- Bar 1: Spend -->
      <rect x="24" y="56" width="22" height="34" rx="4" fill="#cbd5e1"/>
      <text x="35" y="50" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">$10k</text>
      <text x="35" y="100" font-family="'Poppins', sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">Spend</text>

      <!-- Bar 2: Phase 2 -->
      <rect x="58" y="40" width="22" height="50" rx="4" fill="#f59e0b"/>
      <text x="69" y="34" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#d97706" text-anchor="middle">$26k</text>
      <text x="69" y="100" font-family="'Poppins', sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">Mo 2</text>

      <!-- Bar 3: Winner -->
      <rect x="92" y="24" width="22" height="66" rx="4" fill="#ef5b52"/>
      <text x="103" y="18" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="800" fill="#ef5b52" text-anchor="middle">$48k</text>
      <text x="103" y="100" font-family="'Poppins', sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">Mo 3</text>

      <!-- Trendline overlay -->
      <polyline points="35 56, 69 40, 103 24, 150 16" fill="none" stroke="url(#ppcTrendGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="150" cy="16" r="4" fill="#7b4bf7" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Multiplier callout -->
      <rect x="124" y="54" width="52" height="24" rx="5" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="0.8"/>
      <text x="150" y="68.5" font-family="'Poppins', sans-serif" font-size="9" font-weight="800" fill="#be185d" text-anchor="middle">4.82x</text>
    </g>

    <!-- Right: High ROAS & CPA Reduction Metric -->
    <g transform="translate(196, 0)" filter="url(#ppcCardShadow)">
      <rect width="136" height="106" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <text x="14" y="22" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#64748b">Target ROAS</text>
      <text x="14" y="46" font-family="'Poppins', sans-serif" font-size="20" font-weight="800" fill="#ef5b52">+410%</text>

      <!-- CPA Metric Pill -->
      <rect x="12" y="58" width="112" height="20" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
      <text x="68" y="71.5" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">-48% Lower CPA</text>

      <!-- PMax Badge -->
      <rect x="12" y="82" width="112" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="68" y="94.5" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="600" fill="#475569" text-anchor="middle">PMax &amp; Search Verified</text>
    </g>
  </g>
</svg>
