<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <linearGradient id="prCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b4bf7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="prCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="380" height="200" rx="14" fill="url(#prCanvasBg)"/>

  <!-- Left: Heraldic Digital Authority Shield -->
  <g transform="translate(24, 16)" filter="url(#prCardShadow)">
    <rect width="140" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Shield Emblem -->
    <path d="M 70 24 C 95 24, 110 32, 110 62 C 110 94, 70 114, 70 114 C 70 114, 30 94, 30 62 C 30 32, 45 24, 70 24 Z" fill="url(#shieldGrad)"/>
    <!-- Inner Shield Accent -->
    <path d="M 70 30 C 90 30, 102 36, 102 62 C 102 88, 70 106, 70 106 C 70 106, 38 88, 38 62 C 38 36, 50 30, 70 30 Z" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    
    <!-- Verified Checkmark in Shield -->
    <polyline points="56 64, 66 74, 84 56" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Shield Badge -->
    <text x="70" y="138" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Brand Authority</text>
    <rect x="20" y="146" width="100" height="18" rx="9" fill="#ecfdf5"/>
    <text x="70" y="158.5" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#059669" text-anchor="middle">★ VERIFIED TIER-1</text>
  </g>

  <!-- Right: Tier-1 Publication Cards & Sentiment Scorecard -->
  <g transform="translate(176, 16)">
    <!-- Publication 1: Forbes -->
    <g filter="url(#prCardShadow)">
      <rect width="180" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="10" y="7" width="20" height="20" rx="4" fill="#0f172a"/>
      <text x="20" y="21" font-family="'Georgia', serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
      <text x="38" y="22" font-family="'Georgia', serif" font-size="12" font-weight="700" fill="#0f172a">Forbes</text>
      <rect x="114" y="8" width="56" height="18" rx="4" fill="#f8fafc"/>
      <text x="142" y="20" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">Featured</text>
    </g>

    <!-- Publication 2: Bloomberg -->
    <g transform="translate(0, 42)" filter="url(#prCardShadow)">
      <rect width="180" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="10" y="7" width="20" height="20" rx="4" fill="#1e3a8a"/>
      <text x="20" y="21" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
      <text x="38" y="22" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Bloomberg</text>
      <rect x="114" y="8" width="56" height="18" rx="4" fill="#f8fafc"/>
      <text x="142" y="20" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">Executive PR</text>
    </g>

    <!-- Bottom Reputation Metrics Card -->
    <g transform="translate(0, 84)" filter="url(#prCardShadow)">
      <rect width="180" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="20" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#64748b">Digital Reputation Score</text>
      <text x="14" y="46" font-family="'Poppins', sans-serif" font-size="20" font-weight="800" fill="#7b4bf7">99.4%</text>
      
      <!-- Sentiment Pill -->
      <rect x="12" y="56" width="156" height="20" rx="5" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
      <text x="90" y="69.5" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">50+ Placements • Zero Crisis</text>
    </g>
  </g>
</svg>
