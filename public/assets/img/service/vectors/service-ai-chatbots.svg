<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <linearGradient id="chatCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="aiBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b4bf7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="chatCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="380" height="200" rx="14" fill="url(#chatCanvasBg)"/>

  <!-- Main Chat Window Card Frame -->
  <g transform="translate(24, 16)" filter="url(#chatCardShadow)">
    <rect width="332" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Chat Header Bar -->
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 320 0 C 326.63 0, 332 5.37, 332 12 L 332 38 L 0 38 Z" fill="#f8fafc"/>
    <line x1="0" y1="38" x2="332" y2="38" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- AI Avatar Circle -->
    <circle cx="22" cy="19" r="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="22" cy="19" r="4.5" fill="#10b981"/>
    <!-- Online status green dot -->
    <circle cx="30" cy="27" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1"/>
    
    <text x="38" y="18" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Adyantra 24/7 AI Bot</text>
    <text x="38" y="29" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="500" fill="#10b981">Online • WhatsApp &amp; Web Sync</text>

    <!-- Latency Pill on Right -->
    <rect x="236" y="9" width="86" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="279" y="22" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">&lt; 1.8s Response</text>

    <!-- Chat Messages Body -->
    <!-- Message 1: Incoming Lead Bubble (Right-aligned user prompt) -->
    <g transform="translate(90, 48)">
      <rect width="226" height="28" rx="10" fill="#f1f5f9"/>
      <text x="12" y="18" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="500" fill="#1e293b">"Can I book a growth consultation for tomorrow?"</text>
    </g>

    <!-- Message 2: AI Autonomous Response (Left-aligned assistant) -->
    <g transform="translate(16, 84)">
      <rect width="270" height="34" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
      <text x="12" y="16" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#7c3aed">"Certainly! Slot locked for tomorrow at 10:00 AM.</text>
      <text x="12" y="27" font-family="'Poppins', sans-serif" font-size="8" fill="#64748b">Details synced directly to your calendar &amp; CRM."</text>
    </g>

    <!-- Confirmation & CRM Sync Card -->
    <g transform="translate(16, 126)">
      <rect width="300" height="30" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
      <circle cx="16" cy="15" r="7" fill="#10b981"/>
      <polyline points="13 15, 15 17, 19 13" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="28" y="19" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#065f46">HubSpot CRM Synchronized</text>
      <text x="282" y="19" font-family="'Poppins', sans-serif" font-size="8" font-weight="600" fill="#059669" text-anchor="end">0 Delay Webhook</text>
    </g>
  </g>
</svg>
