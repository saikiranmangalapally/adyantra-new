<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <linearGradient id="seoCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="seoTrendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b4bf7"/>
      <stop offset="60%" stop-color="#de358d"/>
      <stop offset="100%" stop-color="#ef5b52"/>
    </linearGradient>
    <linearGradient id="seoRankGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="seoCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background with Soft Rounded Inset -->
  <rect width="380" height="200" rx="14" fill="url(#seoCanvasBg)"/>
  
  <!-- Subtle decorative grid lines -->
  <line x1="20" y1="56" x2="360" y2="56" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="20" y1="120" x2="360" y2="120" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Top: Google Search Bar -->
  <g transform="translate(24, 16)" filter="url(#seoCardShadow)">
    <rect width="332" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Google Colors Icon "G" -->
    <circle cx="20" cy="18" r="10" fill="#f1f5f9"/>
    <text x="20" y="22" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#4285f4" text-anchor="middle">G</text>
    <!-- Search Query -->
    <text x="38" y="22" font-family="'Poppins', sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">best ai automation agency</text>
    <!-- Organic #1 Badge -->
    <rect x="238" y="7" width="86" height="22" rx="11" fill="url(#seoRankGlow)"/>
    <text x="281" y="21.5" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">★ ORGANIC #1</text>
  </g>

  <!-- Main Content Area: Split Cards -->
  <!-- Left Card: Google Search SERP Snippet Preview -->
  <g transform="translate(24, 62)" filter="url(#seoCardShadow)">
    <rect width="186" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- URL line -->
    <text x="14" y="20" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="500" fill="#64748b">https://adyantra.in › seo › growth</text>
    
    <!-- Page Title -->
    <text x="14" y="36" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Adyantra® Organic Search</text>
    
    <!-- Meta Description snippet -->
    <text x="14" y="52" font-family="'Poppins', sans-serif" font-size="8.5" fill="#475569">Technical SEO architecture, topic clusters,</text>
    <text x="14" y="64" font-family="'Poppins', sans-serif" font-size="8.5" fill="#475569">&amp; high-intent keyword ranking for brands.</text>
    
    <!-- Core Web Vitals Tag -->
    <rect x="14" y="80" width="76" height="22" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="52" y="94.5" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#059669" text-anchor="middle">99/100 Vitals</text>

    <!-- Top 3 Ranking Pill -->
    <rect x="96" y="80" width="78" height="22" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="135" y="94.5" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Top 3 Rank</text>
  </g>

  <!-- Right Card: Traffic Growth Velocity Card -->
  <g transform="translate(220, 62)" filter="url(#seoCardShadow)">
    <rect width="136" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Header Metric -->
    <text x="14" y="22" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#64748b">Organic Traffic</text>
    <text x="14" y="44" font-family="'Poppins', sans-serif" font-size="19" font-weight="800" fill="#7b4bf7">+310%</text>

    <!-- Upward Trendline Graph -->
    <path d="M 14 96 C 42 90, 62 76, 82 58 C 96 46, 110 38, 122 30" fill="none" stroke="url(#seoTrendGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="122" cy="30" r="4.5" fill="#ef5b52" stroke="#ffffff" stroke-width="2"/>

    <!-- Bottom Stat Pill -->
    <rect x="12" y="84" width="112" height="20" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="68" y="97.5" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#0f172a" text-anchor="middle">Zero Ad Spend</text>
  </g>
</svg>
