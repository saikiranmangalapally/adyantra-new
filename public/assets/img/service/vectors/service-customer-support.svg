<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <linearGradient id="supCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="supCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="380" height="200" rx="14" fill="url(#supCanvasBg)"/>

  <g transform="translate(24, 16)" filter="url(#supCardShadow)">
    <rect width="332" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Top Header Bar -->
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 320 0 C 326.63 0, 332 5.37, 332 12 L 332 34 L 0 34 Z" fill="#f8fafc"/>
    <line x1="0" y1="34" x2="332" y2="34" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Support Headset Icon -->
    <circle cx="20" cy="17" r="8" fill="#eff6ff"/>
    <path d="M16 17 C16 14, 24 14, 24 17" fill="none" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="14" y="16" width="3" height="5" rx="1" fill="#2563eb"/>
    <rect x="23" y="16" width="3" height="5" rx="1" fill="#2563eb"/>
    
    <text x="34" y="21" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">24/7 Autonomous Customer Desk</text>
    <rect x="236" y="7" width="86" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="279" y="20.5" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">SUB-SECOND</text>

    <!-- Support Telemetry Split -->
    <!-- Left: Automated Ticket Resolution Feed -->
    <g transform="translate(16, 44)">
      <!-- Ticket 1: Resolved Instantly -->
      <g filter="url(#supCardShadow)">
        <rect width="180" height="34" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
        <circle cx="16" cy="17" r="7" fill="#ecfdf5"/>
        <polyline points="13 17, 15 19, 19 15" fill="none" stroke="#10b981" stroke-width="1.5"/>
        <text x="28" y="16" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">Invoice &amp; Order Status</text>
        <text x="28" y="26" font-family="'Poppins', sans-serif" font-size="7" fill="#64748b">AI RAG • 0.6s Resolved</text>
        <rect x="134" y="8" width="38" height="18" rx="4" fill="#ecfdf5"/>
        <text x="153" y="20" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="800" fill="#059669" text-anchor="middle">AUTO</text>
      </g>

      <!-- Ticket 2: Tier-2 Escalation -->
      <g transform="translate(0, 42)" filter="url(#supCardShadow)">
        <rect width="180" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="16" cy="17" r="7" fill="#eff6ff"/>
        <circle cx="16" cy="17" r="3" fill="#2563eb"/>
        <text x="28" y="16" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">Enterprise SLA Routing</text>
        <text x="28" y="26" font-family="'Poppins', sans-serif" font-size="7" fill="#64748b">Escalated to Human VIP</text>
        <rect x="134" y="8" width="38" height="18" rx="4" fill="#eff6ff"/>
        <text x="153" y="20" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="800" fill="#2563eb" text-anchor="middle">SYNC</text>
      </g>

      <!-- Ticket 3: Knowledge Base Sync -->
      <g transform="translate(0, 84)" filter="url(#supCardShadow)">
        <rect width="180" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="12" y="19" font-family="'Poppins', sans-serif" font-size="8" font-weight="600" fill="#475569">Private Knowledge Vector Embeddings Active</text>
      </g>
    </g>

    <!-- Right: Big Metric Gauge Card -->
    <g transform="translate(208, 44)" filter="url(#supCardShadow)">
      <rect width="108" height="114" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#64748b">Auto-Resolved</text>
      <text x="12" y="48" font-family="'Poppins', sans-serif" font-size="22" font-weight="800" fill="#10b981">85%</text>

      <rect x="10" y="60" width="88" height="6" rx="3" fill="#f1f5f9"/>
      <rect x="10" y="60" width="75" height="6" rx="3" fill="#10b981"/>

      <rect x="10" y="78" width="88" height="26" rx="5" fill="#ecfdf5"/>
      <text x="54" y="90" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#059669" text-anchor="middle">Zero Backlog</text>
      <text x="54" y="100" font-family="'Poppins', sans-serif" font-size="6.5" fill="#64748b" text-anchor="middle">24/7 Coverage</text>
    </g>
  </g>
</svg>
