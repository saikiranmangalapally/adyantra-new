<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bookCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="bookCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="380" height="200" rx="14" fill="url(#bookCanvasBg)"/>

  <!-- Calendar Scheduling Interface Frame -->
  <g transform="translate(24, 16)" filter="url(#bookCardShadow)">
    <rect width="332" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Top Header -->
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 320 0 C 326.63 0, 332 5.37, 332 12 L 332 34 L 0 34 Z" fill="#f8fafc"/>
    <line x1="0" y1="34" x2="332" y2="34" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Calendar Icon -->
    <circle cx="20" cy="17" r="8" fill="#f5f3ff"/>
    <rect x="15" y="12" width="10" height="10" rx="2" fill="none" stroke="#7b4bf7" stroke-width="1.2"/>
    <line x1="15" y1="15" x2="25" y2="15" stroke="#7b4bf7" stroke-width="1"/>
    
    <text x="34" y="21" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Autonomous Appointment Scheduler</text>
    <rect x="232" y="7" width="90" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="277" y="20.5" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">REAL-TIME SYNC</text>

    <!-- Calendar Matrix & Time Slots Grid -->
    <!-- Left: Mini Calendar Grid -->
    <g transform="translate(16, 44)">
      <rect width="144" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="12" y="20" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#0f172a">September 2026</text>
      
      <!-- Day Headers -->
      <text x="16" y="36" font-family="'Poppins', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">M</text>
      <text x="36" y="36" font-family="'Poppins', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">T</text>
      <text x="56" y="36" font-family="'Poppins', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">W</text>
      <text x="76" y="36" font-family="'Poppins', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">T</text>
      <text x="96" y="36" font-family="'Poppins', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">F</text>
      <text x="116" y="36" font-family="'Poppins', sans-serif" font-size="7" font-weight="600" fill="#94a3b8">S</text>

      <!-- Calendar Days Matrix -->
      <!-- Highlighted Selected Date -->
      <circle cx="76" cy="56" r="10" fill="#7b4bf7"/>
      <text x="76" y="60" font-family="'Poppins', sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">24</text>
      
      <circle cx="96" cy="56" r="10" fill="#ecfdf5"/>
      <text x="96" y="60" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">25</text>
      
      <rect x="12" y="78" width="120" height="22" rx="4" fill="#ede9fe"/>
      <text x="72" y="92" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">4,500+ Bookings/Mo</text>
    </g>

    <!-- Right: Available Slots & Auto-Lock Confirmation -->
    <g transform="translate(172, 44)">
      <!-- Slot 1 (Confirmed) -->
      <rect width="144" height="32" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <circle cx="16" cy="16" r="6" fill="#10b981"/>
      <polyline points="13 16, 15 18, 19 14" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="28" y="16" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#065f46">10:00 AM - Confirmed</text>
      <text x="28" y="26" font-family="'Poppins', sans-serif" font-size="7" fill="#059669">Google Calendar Synced</text>

      <!-- Slot 2 -->
      <g transform="translate(0, 38)">
        <rect width="144" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="16" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#0f172a">02:30 PM - Available</text>
        <text x="14" y="26" font-family="'Poppins', sans-serif" font-size="7" fill="#64748b">Instant WhatsApp Lock</text>
      </g>

      <!-- Slot 3 -->
      <g transform="translate(0, 76)">
        <rect width="144" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="14" y="16" font-family="'Poppins', sans-serif" font-size="8" font-weight="600" fill="#64748b">No-Show Rate</text>
        <text x="14" y="29" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#10b981">&lt; 2% With Auto Reminders</text>
      </g>
    </g>
  </g>
</svg>
