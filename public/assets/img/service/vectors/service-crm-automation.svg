<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <linearGradient id="crmCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="syncArrowsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7b4bf7"/>
    </linearGradient>
    <filter id="crmCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="380" height="200" rx="14" fill="url(#crmCanvasBg)"/>

  <g transform="translate(24, 16)" filter="url(#crmCardShadow)">
    <rect width="332" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Top Header -->
    <g transform="translate(14, 12)">
      <rect width="176" height="22" rx="11" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
      <circle cx="11" cy="11" r="3.5" fill="#0284c7"/>
      <text x="21" y="15" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#0369a1">TWO-WAY CRM PIPELINE</text>

      <rect x="220" y="0" width="84" height="22" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
      <text x="262" y="14.5" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="800" fill="#059669" text-anchor="middle">0s Latency</text>
    </g>

    <!-- Two-Way Synced Hubs: Ad Source to Enterprise CRM -->
    <g transform="translate(16, 46)">
      <!-- Left Hub: Inbound Channels (Ads & Web) -->
      <g filter="url(#crmCardShadow)">
        <rect width="112" height="106" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="56" cy="28" r="14" fill="#e0f2fe"/>
        <!-- Multi-Channel Icon -->
        <circle cx="48" cy="28" r="4" fill="#0284c7"/>
        <circle cx="64" cy="28" r="4" fill="#7b4bf7"/>
        <text x="56" y="56" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Ad &amp; Web Leads</text>
        <text x="56" y="68" font-family="'Poppins', sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Meta, Google, Forms</text>
        
        <rect x="12" y="78" width="88" height="18" rx="4" fill="#ffffff"/>
        <text x="56" y="90" font-family="'Poppins', sans-serif" font-size="7" font-weight="700" fill="#0284c7" text-anchor="middle">Instant Webhooks</text>
      </g>

      <!-- Center: Bi-Directional Animated Sync Flow -->
      <g transform="translate(118, 20)">
        <!-- Forward Arrow -->
        <path d="M 0 16 L 46 16" stroke="url(#syncArrowsGrad)" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="44 12, 50 16, 44 20" fill="#7b4bf7"/>
        
        <!-- Reverse Arrow -->
        <path d="M 50 38 L 4 38" stroke="url(#syncArrowsGrad)" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="6 34, 0 38, 6 42" fill="#0284c7"/>

        <rect x="6" y="56" width="38" height="16" rx="4" fill="#ecfdf5"/>
        <text x="25" y="67" font-family="'Poppins', sans-serif" font-size="7" font-weight="800" fill="#059669" text-anchor="middle">SYNC</text>
      </g>

      <!-- Right Hub: Enterprise CRM Destination -->
      <g transform="translate(174, 0)" filter="url(#crmCardShadow)">
        <rect width="126" height="106" rx="10" fill="#ffffff" stroke="#7b4bf7" stroke-width="1.5"/>
        <circle cx="63" cy="28" r="14" fill="#f5f3ff"/>
        <!-- Database/CRM Icon -->
        <rect x="52" y="20" width="22" height="16" rx="3" fill="none" stroke="#7b4bf7" stroke-width="1.5"/>
        <line x1="52" y1="25" x2="74" y2="25" stroke="#7b4bf7" stroke-width="1"/>
        <line x1="52" y1="30" x2="74" y2="30" stroke="#7b4bf7" stroke-width="1"/>

        <text x="63" y="56" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="800" fill="#0f172a" text-anchor="middle">Enterprise CRM</text>
        <text x="63" y="68" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="600" fill="#7b4bf7" text-anchor="middle">HubSpot • Salesforce</text>
        
        <rect x="12" y="78" width="102" height="18" rx="4" fill="#f5f3ff"/>
        <text x="63" y="90" font-family="'Poppins', sans-serif" font-size="7" font-weight="700" fill="#6d28d9" text-anchor="middle">Stage Auto-Progress</text>
      </g>
    </g>
  </g>
</svg>
