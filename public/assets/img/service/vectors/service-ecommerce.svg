<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff8f9"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="ecomBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef5b52"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="ecomCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="380" height="200" rx="14" fill="url(#ecomCanvasBg)"/>

  <!-- Left: Sleek D2C Storefront Product Card -->
  <g transform="translate(24, 16)" filter="url(#ecomCardShadow)">
    <rect width="180" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Product Showcase Surface -->
    <rect x="12" y="12" width="156" height="76" rx="8" fill="#f8fafc"/>
    <!-- Minimalist Shopping Bag / Box Vector Artwork -->
    <rect x="58" y="24" width="44" height="42" rx="6" fill="#ffffff" stroke="#ef5b52" stroke-width="1.5"/>
    <path d="M70 24 C70 16, 90 16, 90 24" fill="none" stroke="#ef5b52" stroke-width="1.5"/>
    <!-- Star Rating Pill -->
    <rect x="114" y="16" width="48" height="16" rx="8" fill="#fef3c7"/>
    <text x="138" y="27.5" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#d97706" text-anchor="middle">★ 4.9 (1.2k)</text>

    <!-- Product Title & Price -->
    <text x="14" y="106" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#0f172a">D2C Storefront Scale</text>
    <text x="14" y="120" font-family="'Poppins', sans-serif" font-size="12" font-weight="800" fill="#ef5b52">$149.00</text>
    <text x="74" y="120" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="500" fill="#94a3b8" text-decoration="line-through">$220</text>

    <!-- 1-Click Buy Action Button -->
    <rect x="12" y="130" width="156" height="28" rx="7" fill="url(#ecomBtnGrad)"/>
    <text x="90" y="148" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Buy with 1-Click ➔</text>
  </g>

  <!-- Right: E-Commerce Growth Metrics -->
  <g transform="translate(216, 16)">
    <!-- Metric 1: Cart Recovery -->
    <g filter="url(#ecomCardShadow)">
      <rect width="140" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#fef2f2"/>
      <!-- Cart Icon -->
      <path d="M19 20 L21 20 L23 26 L29 26 L30 22 L22 22" fill="none" stroke="#ef5b52" stroke-width="1.2" stroke-linecap="round"/>
      <text x="40" y="27" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#64748b">Cart Recovery</text>
      
      <text x="14" y="52" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" fill="#ef5b52">+38.5%</text>
      <text x="14" y="66" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="600" fill="#059669">Recovered Lost Sales</text>
    </g>

    <!-- Metric 2: Checkout Speed & Sub-second -->
    <g transform="translate(0, 88)" filter="url(#ecomCardShadow)">
      <rect width="140" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#ecfdf5"/>
      <!-- Lightning Speed Icon -->
      <polygon points="25 18, 20 25, 24 25, 23 30, 28 23, 24 23" fill="#10b981"/>
      <text x="40" y="27" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#64748b">Frictionless Flow</text>

      <text x="14" y="52" font-family="'Poppins', sans-serif" font-size="16" font-weight="800" fill="#0f172a">0.8s Fast</text>
      <text x="14" y="66" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="600" fill="#7b4bf7">Shopify Plus • Amazon</text>
    </g>
  </g>
</svg>
