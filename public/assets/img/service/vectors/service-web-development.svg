<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <linearGradient id="webCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="webCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="380" height="200" rx="14" fill="url(#webCanvasBg)"/>

  <!-- Main Component: Modern Browser Platform Window Frame -->
  <g transform="translate(24, 16)" filter="url(#webCardShadow)">
    <rect width="332" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Browser Top Bar -->
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 320 0 C 326.63 0, 332 5.37, 332 12 L 332 32 L 0 32 Z" fill="#f8fafc"/>
    <line x1="0" y1="32" x2="332" y2="32" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Window Control Dots -->
    <circle cx="16" cy="16" r="4.5" fill="#ef4444"/>
    <circle cx="28" cy="16" r="4.5" fill="#f59e0b"/>
    <circle cx="40" cy="16" r="4.5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="60" y="7" width="168" height="18" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="74" y="20" font-family="'Poppins', sans-serif" font-size="8" font-weight="600" fill="#64748b">https://adyantra.dev/web</text>

    <!-- Browser Body Content Split -->
    <!-- Left: Sleek UI Layout Skeleton -->
    <g transform="translate(16, 46)">
      <!-- Mini Hero Card -->
      <rect width="170" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <rect x="12" y="10" width="70" height="8" rx="3" fill="#0f172a"/>
      <rect x="12" y="22" width="100" height="5" rx="2.5" fill="#94a3b8"/>
      <rect x="12" y="30" width="46" height="10" rx="3" fill="#7b4bf7"/>
      
      <!-- Component Grid 2 Columns -->
      <g transform="translate(0, 56)">
        <rect width="80" height="48" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
        <text x="10" y="18" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#7c3aed">Next.js 15</text>
        <text x="10" y="30" font-family="'Poppins', sans-serif" font-size="7" fill="#64748b">React Server</text>
        <rect x="10" y="34" width="60" height="8" rx="2" fill="#ede9fe"/>

        <rect x="90" y="0" width="80" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
        <text x="100" y="18" font-family="'Poppins', sans-serif" font-size="7.5" font-weight="700" fill="#2563eb">Fast TTFB</text>
        <text x="100" y="30" font-family="'Poppins', sans-serif" font-size="7" fill="#64748b">0.38s Edge</text>
        <rect x="100" y="34" width="60" height="8" rx="2" fill="#dbeafe"/>
      </g>
    </g>

    <!-- Right: Big 100/100 Lighthouse Performance Gauge Card -->
    <g transform="translate(202, 46)" filter="url(#webCardShadow)">
      <rect width="114" height="104" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Lighthouse Ring -->
      <circle cx="57" cy="42" r="28" fill="none" stroke="#f1f5f9" stroke-width="6"/>
      <circle cx="57" cy="42" r="28" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="176" stroke-linecap="round"/>
      <text x="57" y="47" font-family="'Poppins', sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">100</text>
      
      <text x="57" y="80" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#059669" text-anchor="middle">LIGHTHOUSE</text>
      <text x="57" y="92" font-family="'Poppins', sans-serif" font-size="7" font-weight="500" fill="#64748b" text-anchor="middle">Core Web Vitals</text>
    </g>
  </g>
</svg>
